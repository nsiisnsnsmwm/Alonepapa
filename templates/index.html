  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">

    <main>
      <div class="card">
        <h2>Mobile Friendly Card</h2>
        <p>Ye card mobile screen ke liye optimized hai.</p>
        <button>Click Me</button>
      </div>

      <div class="card">
        <h2>Dusra Card</h2>
        <p>App jaisa experience milega full screen me.</p>
        <button>Explore</button>
      </div>
    </main>

    <footer>
      <p>© 2025 My Mobile App Website</p>
    </footer>
  </div>

</html>
